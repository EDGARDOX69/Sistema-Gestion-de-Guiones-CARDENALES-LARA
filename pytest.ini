[pytest]
testpaths = test "Pruebas por modulo"
norecursedirs = venv* .git .opencode docs
addopts = -ra --strict-markers --base-url=http://127.0.0.1:5002
markers =
    unit: logica pura, sin Flask ni MySQL
    integration: Flask + MySQL de prueba
    api: rutas HTTP/API
    smoke: humo, debe correr en segundos
    ui: Playwright
    perf: Locust (no lo ejecuta pytest)
    acceptance: flujo de negocio completo
    db: requiere MySQL de prueba
