<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-blanco.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b12" />
    <meta
      name="description"
      content="Itinerario, sistema de gestión operativa del Estadio Antonio Herrera Gutiérrez."
    />
    <title>Itinerario · Palco de Operaciones</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('itinerario.theme')
          const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          const theme = stored === 'light' || stored === 'dark' ? stored : stored === 'system' ? system : 'dark'
          document.documentElement.dataset.theme = theme
        } catch {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
