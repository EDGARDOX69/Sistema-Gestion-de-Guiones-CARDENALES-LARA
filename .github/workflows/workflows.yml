name: Pruebas Pipelines

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pipelines_pruebas:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: estadio_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Ejecutar pruebas unitarias e integracion
        env:
          FLASK_ENV: testing
          TESTING: "1"
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ""
        run: pytest test/unitarias test/integracion -v

      - name: Ejecutar pruebas de humo backend y aceptacion
        env:
          FLASK_ENV: testing
          TESTING: "1"
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ""
        run: pytest test/humo test/backend test/aceptacion -v
