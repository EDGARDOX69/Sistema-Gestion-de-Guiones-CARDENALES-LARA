name: Pruebas de Aceptación (Gestión de Tareas y Tareas Asignadas)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  aceptacion:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CAPTCHA_ENABLED: "0"
      # create_app() exige SECRET_KEY; en CI no hay archivo .env (esta ignorado).
      SECRET_KEY: clave-de-test-ci
      # Nombres reales que lee app/config.py (los antiguos DB_NAME / DB_SEGURIDAD_NAME se ignoraban).
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME_ESTADIO: estadio_db_test
      DB_NAME_SEGURIDAD: seguridad_test

    steps:
      - name: 1. Descargar código
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest.ini usa --base-url, una opción registrada por pytest-playwright.
          # No hace falta instalar Chromium: estas pruebas usan el cliente de Flask,
          # no navegador. Las pruebas de interfaz levantan su propio servidor con E2E=1.
          pip install pytest pytest-playwright

      - name: 4. Ejecutar pruebas de aceptación
        # El fixture bases_de_prueba clones estadio_db.sql y seguridad.sql a *_test
        # automáticamente; no hay que importar dumps a mano.
        run: pytest test/aceptacion/ -v
