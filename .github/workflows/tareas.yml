name: Pipeline de pruebas - Gestion de Tareas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite lanzarlo a mano desde la extension de GitHub Actions en VS Code,
  # desde la pestaña Actions de github.com o con `gh workflow run`.
  workflow_dispatch:
    inputs:
      etapas:
        description: Etapas a ejecutar
        required: true
        default: todas
        type: choice
        options:
          - todas
          - unidad
          - integracion
          - api
          - humo
          - aceptacion
          - interfaz
          - calidad

jobs:
  pipeline-tareas:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      # En push/PR `inputs.etapas` esta vacio y se usa `todas`.
      ETAPAS_ELEGIDAS: ${{ inputs.etapas || 'todas' }}
      # create_app() exige SECRET_KEY; en CI no hay archivo .env.
      SECRET_KEY: clave-de-test-ci
      CAPTCHA_ENABLED: "0"
      # Nombres reales que lee app/config.py.
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME_ESTADIO: estadio_db_test
      DB_NAME_SEGURIDAD: seguridad_test
      PYTHONIOENCODING: utf-8

    steps:
      - name: 0. Descargar codigo
        uses: actions/checkout@v4

      - name: 1. Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 2. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff pip-audit bandit -r test/interfaz/requirements.txt
          python -m playwright install --with-deps chromium

      - name: 3. Unitarias (sin MySQL)
        if: env.ETAPAS_ELEGIDAS == 'todas' || env.ETAPAS_ELEGIDAS == 'unidad'
        run: python scripts/ci_tareas.py --etapas unidad

      - name: 4. Integracion (BD de prueba)
        if: env.ETAPAS_ELEGIDAS == 'todas' || env.ETAPAS_ELEGIDAS == 'integracion'
        run: python scripts/ci_tareas.py --etapas integracion

      - name: 5. Backend / API
        if: env.ETAPAS_ELEGIDAS == 'todas' || env.ETAPAS_ELEGIDAS == 'api'
        run: python scripts/ci_tareas.py --etapas api

      - name: 6. Humo
        if: env.ETAPAS_ELEGIDAS == 'todas' || env.ETAPAS_ELEGIDAS == 'humo'
        run: python scripts/ci_tareas.py --etapas humo

      - name: 7. Aceptacion
        if: env.ETAPAS_ELEGIDAS == 'todas' || env.ETAPAS_ELEGIDAS == 'aceptacion'
        run: python scripts/ci_tareas.py --etapas aceptacion

      - name: 8. Interfaz / E2E (Playwright)
        if: env.ETAPAS_ELEGIDAS == 'todas' || env.ETAPAS_ELEGIDAS == 'interfaz'
        run: python scripts/ci_tareas.py --etapas interfaz

      - name: 9. Calidad
        if: env.ETAPAS_ELEGIDAS == 'todas' || env.ETAPAS_ELEGIDAS == 'calidad'
        run: python scripts/ci_tareas.py --etapas calidad

      - name: 10. Evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-tareas
          path: docs/pruebas/evidencias/tareas/
          if-no-files-found: warn
